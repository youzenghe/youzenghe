name: Update contribution animation

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution-animation
  cancel-in-progress: true

jobs:
  generate:
    if: github.repository == 'youzenghe/youzenghe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Check profile
        run: node --test tests/*.test.mjs
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%232e78ad&color_dots=%23edf4fa,%23c7e3f4,%238ec8e8,%235ba8d1,%232e78ad
            dist/snake-dark.svg?palette=github-dark&color_snake=%2391d1f2&color_dots=%23161b22,%2320364b,%232e5877,%234587ad,%2391d1f2
      - name: Publish animation assets
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          branch: output
          folder: dist
          clean: true
          force: false
          commit-message: Update contribution animation
